<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; color: #0f172a; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 12px; color: #475569; word-break: break-all; margin: 0 0 12px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <h1>QR code for this page</h1>
  <p id="url">Reading the current tab…</p>
  <button id="go" disabled>Open in MakeQR</button>
  <script src="popup.js"></script>
</body>
</html>
